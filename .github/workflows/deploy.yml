name: DevOps CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t devops-flask:latest .

      - name: Stop Old Container
        run: docker rm -f devops-flask || true

      - name: Run New Container
        run: docker run -d --name devops-flask -p 5001:5001 --entrypoint gunicorn devops-flask:latest --workers 3 --bind 0.0.0.0:5001 app:app

      - name: Verify Container
        run: docker ps
